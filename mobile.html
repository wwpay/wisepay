<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3b5bdb">
<link rel="icon" href="favicon.ico">
<title>WisePay</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#f1f3f9; font-family:-apple-system,"Segoe UI","Meiryo","Malgun Gothic",sans-serif; color:#222; }
  .card { position:relative; background:#fff; border-radius:20px; box-shadow:0 4px 24px rgba(0,0,0,.10);
          padding:56px 32px 40px; width:90%; max-width:460px; text-align:center; }
  .lang { position:absolute; top:12px; right:12px; background:#fff; color:#3b5bdb; border:1px solid #3b5bdb;
          border-radius:8px; font-size:16px; padding:6px 14px; cursor:pointer; }
  .logo { font-size:34px; font-weight:800; color:#3b5bdb; margin:0 0 8px; }
  .title { font-size:26px; font-weight:700; margin:0 0 28px; }
  .btn { display:block; background:#3b5bdb; color:#fff; text-decoration:none; font-size:24px; font-weight:700;
         padding:22px 12px; border-radius:14px; }
  .count { font-size:20px; margin:26px 0 8px; color:#444; }
  .note { font-size:18px; color:#666; line-height:1.6; }
  .urlbox { display:flex; align-items:stretch; margin:22px 0 0; border:1px solid #ced4da; border-radius:12px; overflow:hidden; background:#f8f9fc; }
  .urltext { flex:1; text-align:left; font-size:16px; padding:12px; word-break:break-all; color:#333; user-select:all; }
  .copy { flex:none; border:0; border-left:1px solid #ced4da; background:#e7ecff; color:#3b5bdb; font-size:18px; font-weight:700; padding:0 18px; cursor:pointer; }
</style>
</head>
<body>
<div class="card">
  <button class="lang" id="lang" type="button">한국어</button>
  <p class="logo">WisePay</p>
  <p class="title" id="t-title"></p>
  <a class="btn" id="go" href="https://ds218plus-4694.sargo-banded.ts.net:8443/"></a>
  <div class="urlbox"><div class="urltext" id="urltext"></div><button class="copy" id="copy" type="button"></button></div>
  <p class="count" id="t-count"></p>
  <p class="note" id="t-note"></p>
</div>
<script>
(function () {
  var url = "https://ds218plus-4694.sargo-banded.ts.net:8443/";
  var T = {
    ja: { title: "新しいアドレスに移動しました", go: "新しいアドレスへ移動",
          count: function (n) { return n + "秒後に自動で移動します"; },
          note: "ブックマークやホーム画面のアイコンも<br>新しいアドレスに変更してください。", btn: "한국어", copy: "コピー", copied: "コピーしました" },
    ko: { title: "새 주소로 이동했습니다", go: "새 주소로 가기",
          count: function (n) { return n + "초 후 자동으로 이동합니다"; },
          note: "즐겨찾기와 홈 화면 아이콘도<br>새 주소로 바꿔 주세요.", btn: "日本語", copy: "복사", copied: "복사됨" }
  };
  var lang = "ja", left = 10;
  function draw() {
    var d = T[lang];
    document.documentElement.lang = lang;
    document.getElementById("t-title").textContent = d.title;
    document.getElementById("go").textContent = d.go;
    document.getElementById("t-count").textContent = d.count(left);
    document.getElementById("t-note").innerHTML = d.note;
    document.getElementById("lang").textContent = d.btn;
    document.getElementById("copy").textContent = d.copy;
  }
  document.getElementById("lang").onclick = function () { lang = (lang === "ja") ? "ko" : "ja"; draw(); };
  document.getElementById("urltext").textContent = url;
  document.getElementById("copy").onclick = function () {
    var b = this;
    function done() { b.textContent = T[lang].copied; setTimeout(function () { b.textContent = T[lang].copy; }, 2000); }
    function fallback() {
      var r = document.createRange(); r.selectNodeContents(document.getElementById("urltext"));
      var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      try { document.execCommand("copy"); done(); } catch (e) {}
    }
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(url).then(done, fallback); }
    else { fallback(); }
  };
  draw();
  var t = setInterval(function () {
    left--;
    if (left <= 0) { clearInterval(t); location.replace(url); return; }
    draw();
  }, 1000);
})();
</script>
</body>
</html>
