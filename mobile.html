<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3b5bdb">
<link rel="icon" href="favicon.ico">
<title>WisePay - 새 주소 안내</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#f1f3f9; font-family:-apple-system,"Segoe UI","Malgun Gothic","Meiryo",sans-serif; color:#222; }
  .card { background:#fff; border-radius:20px; box-shadow:0 4px 24px rgba(0,0,0,.10);
          padding:40px 32px; width:90%; max-width:460px; text-align:center; }
  .logo { font-size:34px; font-weight:800; color:#3b5bdb; margin:0 0 8px; }
  .title { font-size:26px; font-weight:700; margin:0 0 28px; }
  .btn { display:block; background:#3b5bdb; color:#fff; text-decoration:none; font-size:24px; font-weight:700;
         padding:22px 12px; border-radius:14px; }
  .count { font-size:20px; margin:26px 0 8px; color:#444; }
  .note { font-size:18px; color:#666; line-height:1.6; }
</style>
</head>
<body>
<div class="card">
  <p class="logo">WisePay</p>
  <p class="title">새 주소로 이동했습니다</p>
  <a class="btn" id="go" href="https://ds218plus-4694.sargo-banded.ts.net:8443/">새 주소로 가기</a>
  <p class="count"><span id="sec">5</span>초 후 자동으로 이동합니다</p>
  <p class="note">즐겨찾기와 홈 화면 아이콘도<br>새 주소로 바꿔 주세요.</p>
</div>
<script>
(function () {
  var url = "https://ds218plus-4694.sargo-banded.ts.net:8443/";
  var left = 5, el = document.getElementById("sec");
  var t = setInterval(function () {
    left--; el.textContent = left;
    if (left <= 0) { clearInterval(t); location.replace(url); }
  }, 1000);
})();
</script>
</body>
</html>
